[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chain-sherlock"
version = "0.1.1"
description = "ChainSherlock: a local-first blockchain transaction investigation toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "loguru>=0.7,<1",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "PyYAML>=6.0,<7",
  "pytest>=8,<9",
  "typer>=0.12,<1",
]

[project.scripts]
crypto-investigator = "crypto_investigator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
