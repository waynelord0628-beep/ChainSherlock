[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chain-sherlock"
version = "0.1.4"
description = "ChainSherlock: a local-first blockchain transaction investigation toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "charset-normalizer>=3.3",
  "loguru>=0.7,<1",
  "markdown>=3.7",
  "networkx>=3.4",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "python-docx>=1.1",
  "pyvis>=0.3.2",
  "python-dateutil>=2.9",
  "reportlab>=4.2",
  "PyYAML>=6.0,<7",
  "jinja2>=3.1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25",
  "typer>=0.12,<1",
  "tenacity>=9.0",
  "respx>=0.22",
  "xlrd>=2.0",
]

[project.scripts]
crypto-investigator = "crypto_investigator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = [
  "integration: opt-in tests that may use externally configured services",
]
