providers:
  ethereum:
    primary: etherscan
    fallback: [blockscout]
  tron:
    primary: trongrid
  bitcoin:
    primary: blockstream
analysis:
  top_counterparties: 20
  graph_max_nodes: 50
  default_depth: 1
  timezone: UTC
cache:
  enabled: true
  directory: data/cache
  ttl_seconds: 86400
http:
  connect_timeout_seconds: 10
  read_timeout_seconds: 30
  total_timeout_seconds: 60
  retries: 3
pagination:
  max_pages: 100
  max_records: 100000
  page_size: 100
output:
  directory: output
  include_raw: true
logging:
  level: INFO

